name: Validate football simulator
on: [push, pull_request]
permissions:
  contents: read
jobs:
  engine:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run build
      - run: git diff --exit-code -- index.html
  browser:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node browser-smoke.mjs
      - run: node season-browser.mjs
      - run: node state-browser.mjs
      - run: node logo-browser.mjs
      - run: node picker-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: browser-results/
